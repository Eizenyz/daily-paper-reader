subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: quantum-ode
      description: >-
        我希望追踪量子算法求解常微分方程、偏微分方程及非幺正动力学的研究，重点包括时变线性系统、耗散方程、时间推进、Schrödingerization 和 Hamiltonian simulation
        的线性组合方法。关注算法构造、关键数学估计和可证明的复杂度改进，尤其是降低演化时间、误差精度、条件数、初态及源项态制备查询、解态恢复带来的成本。也关注快速演化的适用条件、复杂度下界及不可能性结果。
      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: quantum differential equations
          keyword_cn: 量子微分方程
          query: >-
            quantum algorithms for solving ordinary differential equations, partial differential equations, and
            time-dependent linear differential equations
        - keyword: quantum dissipative dynamics
          keyword_cn: 量子耗散动力学
          query: quantum algorithms for dissipative dynamics and open quantum systems
        - keyword: time-dependent linear differential equations
          keyword_cn: 时变线性微分方程
          query: quantum algorithms for time-dependent linear ordinary differential equations
        - keyword: Schrodingerization method
          keyword_cn: 薛定谔化方法
          query: >-
            Schrodingerization, Schrödingerization, Schrodingerisation, and Schrödingerisation transforms for simulating
            non-unitary dynamics and solving differential equations
        - keyword: linear combination Hamiltonian simulation
          keyword_cn: 哈密顿模拟线性组合
          query: >-
            linear combination of Hamiltonian simulation methods for non-unitary dynamics, time-dependent linear
            systems, and differential equation solvers
        - keyword: quantum linear systems
          keyword_cn: 量子线性系统
          query: >-
            quantum linear system solvers for time-dependent and time-independent linear ordinary differential equations
            and partial differential equations
      intent_queries:
        - query: >-
            reducing dependence on evolution time, precision, condition number, and spatial discretization in quantum
            differential equation solvers
          query_cn: 降低量子微分方程求解器对演化时间、精度、条件数和空间离散规模依赖的研究
          enabled: true
          source: manual
          note: ''
        - query: >-
            stability conditions, complexity lower bounds, and impossibility results for quantum differential equation
            algorithms
          query_cn: 量子微分方程算法的稳定性条件、复杂度下界和不可能性结果
          enabled: true
          source: manual
          note: ''
        - query: >-
            quantum algorithms with provable complexity improvements for ordinary differential equation and partial
            differential equation solvers
          query_cn: 具有可证明复杂度改进的常微分方程与偏微分方程量子求解算法
          enabled: true
          source: generated
          note: ''
        - query: >-
            total cost of state preparation, success probability, and solution state recovery in quantum differential
            equation solvers
          query_cn: 量子微分方程求解器中态制备、成功概率与解态恢复的总体成本
          enabled: true
          source: generated
          note: ''
