  - tag: quantum-ode
    description: 我希望追踪量子算法求解常微分方程、偏微分方程及非幺正动力学的研究，重点包括时变线性系统、耗散方程、时间推进、Schrödingerization 和 Hamiltonian simulation 的线性组合方法。关注算法构造、关键数学估计和可证明的复杂度改进，尤其是降低演化时间、误差精度、条件数、初态及源项态制备查询、解态恢复带来的成本。也关注快速演化的适用条件、复杂度下界及不可能性结果。
